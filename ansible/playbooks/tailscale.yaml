---
- name: Install and configure Tailscale on K3s nodes
  hosts: k3s
  become: yes
  vars:
    tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') }}"

  tasks:
    - name: Check whether Tailscale is installed
      ansible.builtin.command:
        cmd: tailscale version
      register: tailscale_version
      changed_when: false
      failed_when: false

    - name: Require a Tailscale auth key
      ansible.builtin.assert:
        that:
          - tailscale_auth_key | length > 0
        fail_msg: Set TAILSCALE_AUTH_KEY in the environment before running this playbook.

    - name: Install Tailscale when it is not installed
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://tailscale.com/install.sh | sh
        executable: /bin/bash
      when: tailscale_version.rc != 0

    - name: Join the tailnet and advertise node tags
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key={{ tailscale_auth_key }}"
          - --advertise-tags=tag:k3s
          - "--hostname={{ inventory_hostname }}"
      no_log: true

    - name: Verify Tailscale connectivity
      ansible.builtin.command:
        cmd: tailscale status
      changed_when: false

    - name: Get the Tailscale IPv4 address
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Verify a Tailscale IPv4 address was assigned
      ansible.builtin.assert:
        that:
          - tailscale_ip.stdout | trim | length > 0
        fail_msg: Tailscale did not return an IPv4 address for {{ inventory_hostname }}.

    - name: Show the Tailscale IPv4 address
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} Tailscale IPv4: {{ tailscale_ip.stdout | trim }}"
