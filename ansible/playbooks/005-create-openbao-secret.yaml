---
- name: Create OpenBao Secret (Generic)
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: vault_token
      prompt: "Enter the Vault token"
      private: true
    - name: secret_name
      prompt: "Secret name (e.g., cloudflared-credentials)"
      private: false
    - name: secret_key
      prompt: "Secret key (e.g., token)"
      private: false
    - name: secret_value
      prompt: "Secret value"
      private: true
  roles:
    - role: create_openbao_secret
