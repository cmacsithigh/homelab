- name: Install Flux
  hosts: localhost
  vars:
    flux_operator_release: flux-operator
    flux_operator_chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    flux_values_source: "{{ playbook_dir }}/../data/flux-values.yaml"
    flux_instance_source: "{{ playbook_dir }}/../../gitops/apps/base/flux-instance.yaml"

  tasks:
  - name: Copy Flux operator values
    copy:
      src: "{{ flux_values_source }}"
      dest: /tmp/flux-values.yaml
      mode: '0644'

  - name: Check whether Flux Operator is already installed
    command:
      cmd: helm list --namespace flux-system --filter "^{{ flux_operator_release }}$" --short
    register: flux_operator_releases
    changed_when: false

  - name: Install Flux operator
    command:
      cmd: >-
        helm upgrade --install {{ flux_operator_release }} {{ flux_operator_chart }} --namespace flux-system --create-namespace --values /tmp/flux-values.yaml
    when: flux_operator_release not in flux_operator_releases.stdout_lines

  - name: Wait for the Flux instance CRD
    command:
      cmd: kubectl get crd fluxinstances.fluxcd.controlplane.io
    register: flux_crd
    retries: 6
    delay: 5
    until: flux_crd.rc == 0
    changed_when: false

  - name: Check whether the Flux instance already exists
    command:
      cmd: kubectl get fluxinstance flux --namespace flux-system --ignore-not-found --output=name
    register: flux_instance
    changed_when: false

  - name: Create the Flux instance for bootstrap
    command:
      cmd: kubectl apply --filename {{ flux_instance_source }}
    when: flux_instance.stdout == ""
