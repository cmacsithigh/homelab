---
- name: Update Debian-based packages on desktop and server
  hosts: k3s, rc2 # only hosts which can handle pat update. OTher hosts (pi 0's) can't handle it.
  serial: 1
  become: yes
  tasks:
    - name: Verify the host uses a Debian-family operating system
      assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: This role supports Debian-based operating systems only.

    - name: Update all installed packages
      apt:
        update_cache: yes
        cache_valid_time: 3600
        upgrade: dist

    - name: Remove unused packages and cached package files
      apt:
        autoremove: yes
        autoclean: yes

    - name: Check whether a reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot the server when required
      reboot:
        msg: Reboot initiated by Ansible after package updates.
        reboot_timeout: 600
        post_reboot_delay: 10
      when: reboot_required.stat.exists
