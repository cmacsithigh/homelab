---
- name: Install Cilium on the K3s cluster
  hosts: k3s_server
  gather_facts: yes
  become: yes
  vars:
    cilium_version: "1.20.5"
    cilium_cli_version: "v0.20.3"
    cilium_pod_cidr: "10.42.0.0/16"
    cilium_k8s_service_port: 6443
    cilium_k8s_service_host: "{{ ansible_host }}"
    cilium_cli_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'unsupported') }}"
    cilium_cli_archive: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
    cilium_cli_checksum: "{{ cilium_cli_archive }}.sha256sum"
    cilium_cli_release_url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version }}"
    k3s_config_path: /etc/rancher/k3s/config.yaml
    k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Check that the K3s server and kubeconfig exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/k3s
        - "{{ k3s_config_path }}"
        - "{{ k3s_kubeconfig_path }}"
      register: k3s_paths

    - name: Require K3s to be installed and configured for Cilium
      ansible.builtin.assert:
        that:
          - k3s_paths.results | map(attribute='stat.exists') | min
        fail_msg: Run the K3s server and agent setup playbooks before installing Cilium.

    - name: Read the K3s server configuration
      ansible.builtin.slurp:
        src: "{{ k3s_config_path }}"
      register: k3s_config

    - name: Require Cilium-compatible K3s networking settings
      ansible.builtin.assert:
        that:
          - "'flannel-backend: none' in (k3s_config.content | b64decode)"
          - "'disable-network-policy: true' in (k3s_config.content | b64decode)"
          - "'disable-kube-proxy: true' in (k3s_config.content | b64decode)"
        fail_msg: >-
          Configure K3s with flannel-backend: none, disable-network-policy: true,
          and disable-kube-proxy: true, then rerun the K3s server configuration playbook.

    - name: Require a supported Cilium CLI architecture
      ansible.builtin.assert:
        that:
          - cilium_cli_arch != 'unsupported'
        fail_msg: "Cilium CLI does not have a configured release asset for {{ ansible_architecture }}."

    - name: Check the installed Cilium CLI version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cilium
          - version
          - --client
      register: cilium_cli_current
      changed_when: false
      failed_when: false

    - name: Install the pinned Cilium CLI
      when: cilium_cli_version not in cilium_cli_current.stdout
      block:
        - name: Download the Cilium CLI checksum file
          ansible.builtin.get_url:
            url: "{{ cilium_cli_release_url }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz.sha256sum"
            dest: "{{ cilium_cli_checksum }}"
            mode: '0644'

        - name: Download the Cilium CLI archive
          ansible.builtin.get_url:
            url: "{{ cilium_cli_release_url }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
            dest: "{{ cilium_cli_archive }}"
            mode: '0644'

        - name: Verify the Cilium CLI archive checksum
          ansible.builtin.command:
            argv:
              - sha256sum
              - --check
              - --status
              - "{{ cilium_cli_checksum }}"
          args:
            chdir: /tmp
          changed_when: false

        - name: Extract the Cilium CLI into /usr/local/bin
          ansible.builtin.unarchive:
            src: "{{ cilium_cli_archive }}"
            dest: /usr/local/bin
            remote_src: yes

        - name: Remove the downloaded Cilium CLI files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ cilium_cli_archive }}"
            - "{{ cilium_cli_checksum }}"

    - name: Install Cilium with kube-proxy replacement
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cilium
          - install
          - --version
          - "{{ cilium_version }}"
          - "--set=ipam.operator.clusterPoolIPv4PodCIDRList={{ cilium_pod_cidr }}"
          - "--set=kubeProxyReplacement=true"
          - "--set=k8sServiceHost={{ cilium_k8s_service_host }}"
          - "--set=k8sServicePort={{ cilium_k8s_service_port }}"
          - "--set=envoy.enabled=false"
          - "--set=hubble.enabled=true"
          - "--set=hubble.relay.enabled=true"
          - "--set=hubble.ui.enabled=true"
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"

    - name: Wait for Cilium to become ready
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cilium
          - status
          - --wait
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"
      changed_when: false

    - name: Run the Cilium connectivity test
      ansible.builtin.command:
        argv:
          - /usr/local/bin/cilium
          - connectivity
          - test
      environment:
        KUBECONFIG: "{{ k3s_kubeconfig_path }}"
      async: 1800
      poll: 10
      changed_when: false
