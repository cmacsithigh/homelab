name: Build and Push images

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - 'images/**'

env:
  REGISTRY: ghcr.io

jobs:
  docker-mpd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mpd
      BUILD_DIR: images/mpd
    outputs:
      new_release_published: ${{ steps.semantic_dry_run.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry_run.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (Dry Run)
        id: semantic_dry_run
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          working_directory: .
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure lowercased image name
        id: image_name
        run: |
          echo "value=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.semantic_dry_run.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_DIR }}
          platforms: linux/amd64,linux/arm64
          file: ${{ env.BUILD_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.value }}:latest
            ${{ steps.image_name.outputs.value }}:${{ steps.semantic_dry_run.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-mpd:
    needs: docker-mpd
    if: needs.docker-mpd.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (Actual Release)
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: .
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-mympd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mympd
      BUILD_DIR: images/mympd
    outputs:
      new_release_published: ${{ steps.semantic_dry_run.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_dry_run.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (Dry Run)
        id: semantic_dry_run
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          working_directory: .
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure lowercased image name
        id: image_name
        run: |
          echo "value=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.semantic_dry_run.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_DIR }}
          platforms: linux/amd64,linux/arm64
          file: ${{ env.BUILD_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image_name.outputs.value }}:latest
            ${{ steps.image_name.outputs.value }}:${{ steps.semantic_dry_run.outputs.new_release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-mympd:
    needs: docker-mympd
    if: needs.docker-mympd.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release (Actual Release)
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: .
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
