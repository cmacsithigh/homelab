apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: keycloak-chart
  namespace: flux-system
spec:
  image: registry-1.docker.io/bitnamicharts/keycloak
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: keycloak-chart
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: keycloak-chart
  policy:
    semver:
      range: ">=0.0.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: keycloak-image
  namespace: flux-system
spec:
  image: bitnamilegacy/keycloak
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: keycloak-image
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: keycloak-image
  filterTags:
    pattern: '^([0-9]+\.[0-9]+\.[0-9]+)-debian-12-r[0-9]+$'
    extract: '$1'
  policy:
    semver:
      range: ">=0.0.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  update:
    strategy: Setters
    path: ./gitops/apps/keycloak/helm.yaml
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore(infra): {{ .Changed.Summary }}"
    push:
      branch: main
