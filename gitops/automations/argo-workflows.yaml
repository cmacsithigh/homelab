apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  image: ghcr.io/argoproj/argo-helm/argo-workflows
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: argo-workflows
  policy:
    semver:
      range: ">=2.0.0 <3.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  update:
    strategy: Setters
    path: ./gitops/apps/argo-workflows/helm.yaml
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "chore(infra): {{ .Changed.Summary }}"
    push:
      branch: main
