apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: renovate
  namespace: flux-system
spec:
  image: ghcr.io/renovate/renovate
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: renovate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: renovate
  policy:
    semver:
      range: ">=0.0.1"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: renovate
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  update:
    strategy: Setters
    path: ./gitops/apps/renovate/cronjob.yaml
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@://github.com
        name: fluxcdbot
      messageTemplate: "chore(infra): updating renovate image to {{ .Updated.LatestImage }}"
    push:
      branch: main
