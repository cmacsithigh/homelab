apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: media-gluetun
  namespace: flux-system
spec:
  image: qmcgaw/gluetun
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: media-gluetun
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: media-gluetun
  policy:
    semver:
      range: ">=0.0.1"
