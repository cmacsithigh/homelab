---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: media-redis
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: media-redis
  filterTags:
    pattern: '^([0-9]+\.[0-9]+(\.[0-9]+)?)-alpine$'
    extract: '$1'
  policy:
    semver:
      range: ">=7.4.0"
