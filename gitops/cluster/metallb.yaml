---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-base
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: base
  path: ./gitops/apps/metallb/base
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-deploy
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: base
    - name: metallb-base
  path: ./gitops/apps/metallb/deploy
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
