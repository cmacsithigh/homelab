---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: base
    - name: external-secrets
    - name: openbao
    - name: cloudnative-pg
  path: ./gitops/apps/keycloak
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
