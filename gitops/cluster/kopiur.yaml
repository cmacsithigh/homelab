---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
  - name: base
  path: ./gitops/apps/kopiur/base
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-deploy
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
  - name: kopiur
  path: ./gitops/apps/kopiur/deploy
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
