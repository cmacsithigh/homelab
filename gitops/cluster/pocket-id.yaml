---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
  - name: base
  - name: cloudnative-pg
  path: ./gitops/apps/pocket-id
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  postBuild:
    substituteFrom:
    - kind: Secret
      name: pocket-id-bootstrap
