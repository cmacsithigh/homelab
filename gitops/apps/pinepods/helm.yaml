---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pinepods
  namespace: flux-system
spec:
  interval: 120m
  url: https://helm.pinepods.online
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
  namespace: flux-system
spec:
  releaseName: pinepods
  chart:
    spec:
      chart: pinepods
      sourceRef:
        kind: HelmRepository
        name: pinepods
        namespace: flux-system
      version: 0.9.2
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: pinepods
  values:
    service:
      type: ClusterIP
      port: 8040
    ingress:
      enabled: false
    persistence:
      enabled: true
      downloads:
        storageClass: nfs-internal-ssd
        accessMode: ReadWriteMany
        size: 10Gi
      backups:
        storageClass: nfs-internal-ssd
        accessMode: ReadWriteMany
        size: 5Gi
    postgresql:
      enabled: false
    externalDatabase:
      type: postgresql
      host: pinepods-pg-rw
      port: 5432
      database: pinepods_database
      manuallyProvide: true
    valkey:
      enabled: true
    env:
      USERNAME: ""
      PASSWORD: ""
      FULLNAME: ""
      EMAIL: ""
      HOSTNAME: https://pinepods.ciansheehy.co
    extraEnv:
    - name: DB_TYPE
      value: postgresql
    - name: DB_HOST
      value: pinepods-pg-rw
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: pinepods_database
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: pinepods-pg-app
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pinepods-pg-app
          key: password
    - name: OIDC_PROVIDER_NAME
      value: Pocket ID
    - name: OIDC_CLIENT_ID
      value: pinepods
    - name: OIDC_DISCOVERY_URL
      value: https://pocketid.ciansheehy.co/.well-known/openid-configuration
    - name: OIDC_SCOPE
      value: "openid email profile groups"
    - name: OIDC_ROLES_CLAIM
      value: groups
    - name: OIDC_USER_ROLE
      value: regular
    - name: OIDC_ADMIN_ROLE
      value: admins
    - name: OIDC_DISABLE_STANDARD_LOGIN
      value: "true"
    - name: OIDC_BUTTON_TEXT
      value: Login with Pocket ID
    - name: OIDC_BUTTON_COLOR
      value: "#417598"
    - name: OIDC_BUTTON_TEXT_COLOR
      value: "#ffffff"
    - name: OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: pinepods-oidc
          key: client-secret
    backend:
      enabled: false
    podpeople:
      enabled: false
    ai:
      enabled: false
