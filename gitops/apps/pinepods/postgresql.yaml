---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pinepods-pg
  namespace: pinepods
spec:
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: pinepods_database
      owner: pinepods
  storage:
    storageClass: nfs-internal-ssd
    size: 5Gi
