---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: backube
  namespace: flux-system
spec:
  interval: 24h
  url: https://backube.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: flux-system
spec:
  releaseName: volsync
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: volsync-system
  values:
    replicaCount: 1
    manageCRDs: true
