apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: music-assistant-data-restore
  namespace: sound-system
spec:
  source:
    fromPolicy:
      name: music-assistant-data
      offset: 0
  target:
    pvcRef:
      name: music-assistant-data
  mover:
    privilegedMode: true
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
