---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mpd
  name: mpd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mpd
  template:
    metadata:
      labels:
        app: mpd
    spec:
      containers:
        - image: ghcr.io/cmacsithigh/mpd:1.3.0
          imagePullPolicy: Always
          name: mpd
          ports:
            - containerPort: 6600
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /fifo
              name: fifo
            - mountPath: /var/lib/mpd/playlists
              name: mympd
              subPath: playlists
      hostname: mpd
      nodeSelector:
        kubernetes.io/hostname: pi4-server
      volumes:
        - name: fifo
          persistentVolumeClaim:
            claimName: mpd-fifo
        - name: mympd
          persistentVolumeClaim:
            claimName: mympd