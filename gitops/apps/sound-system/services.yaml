---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mpd
  name: mpd
spec:
  ports:
    - name: mpd
      port: 6600
      targetPort: 6600
  selector:
    app: mpd
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.18.201
  labels:
    app: mympd
  name: mympd
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: mympd
  type: LoadBalancer