apiVersion: v1
kind: Service
metadata:
  name: dispatcharr
  annotations:
    metallb.io/loadBalancerIPs: 192.168.18.227
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 9191
    name: http
  selector:
    app: dispatcharr
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcharr-redis
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: redis
  selector:
    app: dispatcharr-redis
---
apiVersion: v1
kind: Service
metadata:
  name: dispatcharr-public
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
  - port: 80
    targetPort: 9191
  selector:
    app: dispatcharr
