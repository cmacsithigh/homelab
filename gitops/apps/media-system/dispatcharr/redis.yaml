apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-redis
  labels:
    app: dispatcharr-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr-redis
  template:
    metadata:
      labels:
        app: dispatcharr-redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4-server
      containers:
      - name: redis
        image: redis:8.10.3-alpine # {"$imagepolicy": "flux-system:media-redis"}
        command:
        - redis-server
        - --timeout
        - "300"
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
