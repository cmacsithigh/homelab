apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
  labels:
    app: dispatcharr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.3
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        envFrom:
        - secretRef:
            name: openvpn-user
        - secretRef:
            name: openvpn-password
        env:
        - name: FIREWALL_INPUT_PORTS
          value: "9191"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.42.0.0/16,10.43.0.0/16,192.168.0.0/16"
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_SERVICE_PROVIDER
          value: protonvpn
        - name: VPN_TYPE
          value: openvpn
        - name: SERVER_COUNTRIES
          value: Netherlands,Germany,Sweden,Switzerland
        ports:
        - containerPort: 9191
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      - name: dispatcharr-web
        image: ghcr.io/dispatcharr/dispatcharr:0.32.0
        envFrom:
        - configMapRef:
            name: dispatcharr-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatcharr-postgres-app
              key: password
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi
      - name: dispatcharr-celery
        image: ghcr.io/dispatcharr/dispatcharr:0.32.0
        command:
        - /app/docker/entrypoint.celery.sh
        envFrom:
        - configMapRef:
            name: dispatcharr-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatcharr-postgres-app
              key: password
        - name: DISPATCHARR_WEB_HOST
          value: localhost
        - name: DISPATCHARR_PORT
          value: "9191"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dispatcharr-data
