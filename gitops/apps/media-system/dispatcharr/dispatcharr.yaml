apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
  labels:
    app: dispatcharr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr
  template:
    metadata:
      labels:
        app: dispatcharr
    spec:
      nodeSelector:
        kubernetes.io/hostname: rpi5-worker
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
      initContainers:
      - name: fix-data-perms
        image: ghcr.io/dispatcharr/dispatcharr:0.34.0
        command: [ "sh", "-c", "chown -R dispatcharr:dispatcharr /data/plugins || true; chmod -R g+uw /data/plugins || true" ]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.3 # {"$imagepolicy": "flux-system:media-gluetun"}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        envFrom:
        - secretRef:
            name: openvpn-user
        - secretRef:
            name: openvpn-password
        env:
        - name: FIREWALL_INPUT_PORTS
          value: "9191"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.42.0.0/16,10.43.0.0/16,192.168.0.0/16"
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_SERVICE_PROVIDER
          value: protonvpn
        - name: VPN_TYPE
          value: openvpn
        - name: SERVER_COUNTRIES
          value: Netherlands,Germany,France
        ports:
        - containerPort: 9191
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      - name: dispatcharr-web
        image: ghcr.io/dispatcharr/dispatcharr:0.34.0 # {"$imagepolicy": "flux-system:media-dispatcharr"}
        envFrom:
        - configMapRef:
            name: dispatcharr-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatcharr-postgres-app
              key: password
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi
      - name: dispatcharr-celery
        image: ghcr.io/dispatcharr/dispatcharr:0.34.0 # {"$imagepolicy": "flux-system:media-dispatcharr"}
        command: [ "/bin/bash", "-c" ]
        args:
        - |
          set -e
          echo "Applying gevent/flock workaround to loader.py"
          sed -i 's/from gevent import sleep/import time/; s/sleep(0\.01)/time.sleep(0.01)/' /app/apps/plugins/loader.py
          exec /app/docker/entrypoint.celery.sh
        envFrom:
        - configMapRef:
            name: dispatcharr-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dispatcharr-postgres-app
              key: password
        - name: DISPATCHARR_WEB_HOST
          value: localhost
        - name: DISPATCHARR_PORT
          value: "9191"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dispatcharr-data
