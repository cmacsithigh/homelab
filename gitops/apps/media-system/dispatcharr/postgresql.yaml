---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dispatcharr-pg
spec:
  affinity:
    nodeSelector:
      kubernetes.io/hostname: rpi5-worker
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: dispatcharr
      owner: dispatcharr
      secret:
        name: dispatcharr-postgres-app
  storage:
    storageClass: nfs-internal-ssd
    size: 5Gi
