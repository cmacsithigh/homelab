apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dispatcharr-postgres
spec:
  affinity:
    nodeSelector:
      kubernetes.io/hostname: pi4-server
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: dispatcharr
      owner: dispatcharr
  storage:
    storageClass: nfs-storage
    size: 5Gi
