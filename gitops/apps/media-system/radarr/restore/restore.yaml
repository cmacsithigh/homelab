apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: radarr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: radarr
      offset: 0
  target:
    pvcRef:
      name: radarr-conf
  mover:
    privilegedMode: true
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
