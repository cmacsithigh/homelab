apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pi4-server
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-data-dirs
          image: busybox:latest
          command:
            - sh
            - -c
            - mkdir -p /data/media/movies /data/media/tv /data/usenet/complete /data/usenet/incomplete
            - chown -R 777 /data/media /data/usenet /data/torrents
          volumeMounts:
            - name: media-storage
              mountPath: /data
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1
          ports:
            - containerPort: 8096
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media-storage
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage-pvc
