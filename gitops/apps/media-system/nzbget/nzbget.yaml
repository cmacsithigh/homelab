---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      initContainers:
      - name: install-scripts
        image: busybox:1.38
        command:
        - sh
        - -c
        - |
          mkdir -p /config/scripts
          cp /scripts/ntfy.py /config/scripts/ntfy.py
          chmod 0755 /config/scripts/ntfy.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
      nodeSelector:
        kubernetes.io/hostname: rpi5-worker
      containers:
      - name: nzbget
        image: ghcr.io/nzbgetcom/nzbget:v26.3
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 6789
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-storage
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: nzbget-config
      - name: scripts
        configMap:
          name: nzbget-scripts
      - name: media-storage
        persistentVolumeClaim:
          claimName: media-storage-pvc # Shared storage PVC across Servarr apps
