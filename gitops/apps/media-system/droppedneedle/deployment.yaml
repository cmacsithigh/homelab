apiVersion: apps/v1
kind: Deployment
metadata:
  name: droppedneedle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: droppedneedle
  template:
    metadata:
      labels:
        app: droppedneedle
    spec:
      containers:
        - name: droppedneedle
          image: ghcr.io/droppedneedle/droppedneedle:v2.15.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "027"
            - name: PORT
              value: "8688"
            - name: TZ
              value: Etc/UTC
          ports:
            - name: http
              containerPort: 8688
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: cache
              mountPath: /app/cache
            - name: plugins
              mountPath: /app/plugins
            - name: media
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: droppedneedle-config
        - name: cache
          persistentVolumeClaim:
            claimName: droppedneedle-cache
        - name: plugins
          persistentVolumeClaim:
            claimName: droppedneedle-plugins
        - name: media
          persistentVolumeClaim:
            claimName: media-storage-pvc
