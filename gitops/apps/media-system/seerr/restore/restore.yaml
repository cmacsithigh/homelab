apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: seerr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: seerr
      offset: 0
  target:
    pvcRef:
      name: seerr-conf
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
      - 65532
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
