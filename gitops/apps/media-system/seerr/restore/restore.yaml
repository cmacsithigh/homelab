apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: seerr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: seerr
      offset: 0
  target:
    pvcRef:
      name: seerr-conf
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
