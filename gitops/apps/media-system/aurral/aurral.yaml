apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurral
  labels:
    app: aurral
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aurral
  template:
    metadata:
      labels:
        app: aurral
    spec:
      containers:
        - name: aurral
          image: ghcr.io/lklynet/aurral:v2.10.0
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - containerPort: 3001
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: aurral-config-pvc
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage-pvc
