apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixarr-redis
  labels:
    app: mixarr-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixarr-redis
  template:
    metadata:
      labels:
        app: mixarr-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mixarr-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mixarr-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: mixarr-redis
