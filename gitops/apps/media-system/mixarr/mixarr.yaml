apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixarr
  labels:
    app: mixarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixarr
  template:
    metadata:
      labels:
        app: mixarr
    spec:
      containers:
        - name: mixarr
          image: ghcr.io/aquantumofdonuts/mixarr:slim
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mixarr-secrets
                  key: MYSQL_PASSWORD
            - name: DATABASE_URL
              value: mysql://mixarr:$(MYSQL_PASSWORD)@mixarr-mariadb:3306/mixarr
            - name: REDIS_URL
              value: redis://mixarr-redis:6379
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: mixarr-secrets
                  key: SESSION_SECRET
          ports:
            - containerPort: 3000
              name: web
            - containerPort: 3005
              name: api
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mixarr-data-pvc
