apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixarr-mariadb
  labels:
    app: mixarr-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixarr-mariadb
  template:
    metadata:
      labels:
        app: mixarr-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:13
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_DATABASE
              value: mixarr
            - name: MYSQL_USER
              value: mixarr
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mixarr-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mixarr-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mixarr-mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mixarr-mariadb
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app: mixarr-mariadb
