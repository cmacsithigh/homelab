---
apiVersion: batch/v1
kind: Job
metadata:
  name: media-transfer
  labels:
    app.kubernetes.io/name: media-transfer
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-transfer
    spec:
      restartPolicy: Never
      containers:
      - name: transfer
        image: alpine:3.24
        command:
        - /bin/sh
        - -ec
        - >-
          apk add --no-cache rsync && rsync -av --itemize-changes --human-readable --info=progress2 --stats "/transfer/source/media/media/tv/" "/transfer/target/media/media/tv/"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: source-media
          mountPath: /transfer/source/media
          readOnly: true
        - name: target-media
          mountPath: /transfer/target/media
      volumes:
      - name: source-media
        persistentVolumeClaim:
          claimName: media-storage-pvc
      - name: target-media
        persistentVolumeClaim:
          claimName: media-storage
