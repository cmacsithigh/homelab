---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-transfer
  labels:
    app.kubernetes.io/name: media-transfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-transfer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-transfer
    spec:
      containers:
      - name: transfer
        image: alpine:3.22
        command:
        - /bin/sh
        - -ec
        - apk add --no-cache rsync && exec sleep 2147483647
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: source-media
          mountPath: /transfer/source/media
          readOnly: true
        - name: target-media
          mountPath: /transfer/target/media
      volumes:
      - name: source-media
        persistentVolumeClaim:
          claimName: media-storage-pvc
      - name: target-media
        persistentVolumeClaim:
          claimName: media-storage
