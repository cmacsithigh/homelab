apiVersion: apps/v1
kind: Deployment
metadata:
  name: sportarr
  labels:
    app: sportarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sportarr
  template:
    metadata:
      labels:
        app: sportarr
    spec:
      containers:
        - name: sportarr
          image: sportarr/sportarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "022"
            - name: TZ
              value: Etc/UTC
          ports:
            - containerPort: 1867
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-storage
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sportarr-config
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage-pvc
