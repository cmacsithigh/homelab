apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: wizarr
spec:
  repository:
    kind: ClusterRepository
    name: local-nfs
  sources:
  - pvc:
      name: wizarr-conf
  copyMethod: Direct
  retention:
    keepDaily: 7
    keepWeekly: 2
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 65532
  verification:
    quick:
      schedule:
        cron: "30 1 * * *"
        jitter: 30m
    successExpr: "stats.files > 0 && stats.errors == 0"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: wizarr-daily
spec:
  policyRef:
    name: wizarr
  schedule:
    cron: "*/10 * * * *"
    timezone: Etc/UTC
    runOnCreate: true
