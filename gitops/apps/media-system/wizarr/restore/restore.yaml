apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: wizarr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: wizarr
      offset: 0
  target:
    pvc:
      name: wizarr-conf
      storageClassName: nfs-internal-ssd
      capacity: 2Gi
      accessModes:
      - ReadWriteMany
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
