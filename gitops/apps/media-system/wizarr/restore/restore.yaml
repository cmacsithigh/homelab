apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: wizarr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: wizarr
      offset: 0
  target:
    pvcRef:
      name: wizarr-conf
  mover:
    privilegedMode: true
    securityContext:
      runAsUser: 0
      runAsGroup: 1000
      runAsNonRoot: false
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
      - 65532
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
