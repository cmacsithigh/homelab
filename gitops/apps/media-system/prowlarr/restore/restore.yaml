apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: prowlarr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: prowlarr
      offset: 0
  target:
    pvcRef:
      name: prowlarr-conf
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
