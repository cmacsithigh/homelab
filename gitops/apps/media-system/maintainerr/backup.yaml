apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: maintainerr
spec:
  repository:
    kind: ClusterRepository
    name: local-nfs
  sources:
  - pvc:
      name: maintainerr-conf
  copyMethod: Direct
  retention:
    keepDaily: 14
  credentialProjection:
    enabled: true
  mover:
    privilegedMode: true
  verification:
    quick:
      schedule:
        cron: "0 2 * * *"
        jitter: 30m
    successExpr: "stats.files > 0 && stats.errors == 0"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: maintainerr-daily
spec:
  policyRef:
    name: maintainerr
  schedule:
    cron: "0 1 * * *"
    runOnCreate: true
