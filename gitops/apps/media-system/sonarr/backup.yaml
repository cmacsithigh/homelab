apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: sonarr
spec:
  repository:
    kind: ClusterRepository
    name: local-nfs
  sources:
  - pvc:
      name: sonarr-conf
  copyMethod: Direct
  retention:
    keepDaily: 14
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
  verification:
    quick:
      schedule:
        cron: "0 2 * * *"
        jitter: 30m
    successExpr: "stats.files > 0 && stats.errors == 0"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: sonarr-daily
spec:
  policyRef:
    name: sonarr
  schedule:
    cron: "0 1 * * *"
    runOnCreate: true
