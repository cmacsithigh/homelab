apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: sonarr-restore
  namespace: media-system
spec:
  source:
    fromPolicy:
      name: sonarr
      offset: 0
  target:
    pvcRef:
      name: sonarr-conf
  mover:
    privilegedMode: true
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
