---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 120m
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  chart:
    spec:
      chart: openbao
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      version: 0.29.0
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: openbao-system
  postRenderers:
    - kustomize:
        patchesJson6902:
          - target:
              group: ""
              version: v1
              kind: Service
              name: openbao-system-openbao
              namespace: openbao-system
            patch:
              - op: replace
                path: /spec/type
                value: LoadBalancer
              - op: add
                path: /metadata/annotations/metallb.io~1loadBalancerIPs
                value: 192.168.18.205
  values:
    ui:
      enabled: true