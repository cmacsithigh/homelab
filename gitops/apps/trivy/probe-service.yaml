apiVersion: v1
kind: Service
metadata:
  name: trivy-operator-health
  namespace: trivy-system
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: http://trivy-operator-health.trivy-system.svc.cluster.local:80/readyz/
      conditions:
        - "[STATUS] == 200"
      alerts:
        - type: ntfy
spec:
  ports:
  - name: health
    port: 80
    targetPort: probes
  selector:
    app.kubernetes.io/instance: trivy-operator
    app.kubernetes.io/name: trivy-operator
  type: ClusterIP
