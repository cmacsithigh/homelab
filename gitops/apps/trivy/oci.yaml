apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/aquasecurity/helm-charts/trivy-operator
  ref:
    tag: 0.32.1 # {"$imagepolicy": "flux-system:trivy-operator-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: flux-system
spec:
  releaseName: trivy-operator
  chartRef:
    kind: OCIRepository
    name: trivy-operator
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: trivy-system
  values:
    operator:
      scanJobsConcurrentLimit: 3
