apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/argoproj/argo-helm/argo-workflows
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 2.0.18 # {"$imagepolicy": "flux-system:argo-workflows:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: flux-system
spec:
  releaseName: argo-workflows
  chartRef:
    kind: OCIRepository
    name: argo-workflows
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: argo-workflows
  values:
    crds:
      full: false
