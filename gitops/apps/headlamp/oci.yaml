# https://github.com/kubernetes-sigs/headlamp/blob/main/charts/headlamp/values.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/home-operations/charts-mirror/headlamp
  ref:
    tag: 0.46.0 # {"$imagepolicy": "flux-system:headlamp-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  releaseName: headlamp
  targetNamespace: headlamp-system
  interval: 60m
  chartRef:
    kind: OCIRepository
    name: headlamp
    namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  values:
    replicaCount: 1
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.203
      type: LoadBalancer
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
              - rc2
    config:
      inCluster: true
      oidc:
        callbackURL: https://headlamp.ciansheehy.co/oidc-callback
        clientID: headlamp
        clientSecret: "${secret}"
        issuerURL: https://pocketid.ciansheehy.co
        scopes: "openid profile email groups"
        autoLogin: true
        secret:
          create: false
    serviceAccount:
      create: false
      name: headlamp
    clusterRoleBinding:
      create: true
    securityContext:
      runAsUser: 100
      allowPrivilegeEscalation: false
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 32Mi
