# https://github.com/kubernetes-sigs/headlamp/blob/main/charts/headlamp/values.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 120m
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  targetNamespace: headlamp-system
  interval: 60m
  chart:
    spec:
      chart: headlamp
      version: 0.44.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  releaseName: headlamp
  install:
    createNamespace: false
    remediation:
      retries: 3
  values:
    replicaCount: 1
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.203
      type: LoadBalancer
    config:
      inCluster: true
      oidc:
        callbackURL: https://headlamp.ciansheehy.co/oidc-callback
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          hasScopes: true
    serviceAccount:
      create: false
      name: headlamp
    clusterRoleBinding:
      create: true
    securityContext:
      runAsUser: 100
      allowPrivilegeEscalation: false
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 32Mi