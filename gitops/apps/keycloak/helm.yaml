---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 120m
  url: oci://registry-1.docker.io/bitnamicharts/keycloak
  ref:
    tag: 25.2.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: keycloak
    namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: keycloak-system
  values:
    image:
      repository: quay.io/keycloak/keycloak
      tag: 26.7.3
    auth:
      adminUser: admin
      existingSecret: keycloak-credentials
      passwordSecretKey: password
    production: false
    hostname: keycloak.ciansheehy.co
    proxyHeaders: xforwarded
    httpEnabled: true
    hostnameStrict: true
    serviceAccount:
      create: true
    ingress:
      enabled: false
    postgresql:
      enabled: false
    externalDatabase:
      host: keycloak-postgresql-rw
      port: 5432
      user: keycloak
      database: keycloak
      existingSecret: keycloak-postgresql-app
      existingSecretUserKey: username
      existingSecretPasswordKey: password
    persistence:
      enabled: false