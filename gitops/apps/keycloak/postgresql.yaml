---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgresql
  namespace: keycloak-system
spec:
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    storageClass: nfs-storage
    size: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: keycloak-system
spec:
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    pg_basebackup:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-postgresql-app
      source: keycloak-postgresql
  replica:
    enabled: true
    source: keycloak-postgresql
  externalClusters:
  - name: keycloak-postgresql
    connectionParameters:
      host: keycloak-postgresql-rw.keycloak-system.svc
      user: streaming_replica
      dbname: postgres
      sslmode: verify-full
    sslKey:
      name: keycloak-postgresql-replication
      key: tls.key
    sslCert:
      name: keycloak-postgresql-replication
      key: tls.crt
    sslRootCert:
      name: keycloak-postgresql-ca
      key: ca.crt
  storage:
    storageClass: nfs-internal-ssd
    size: 1Gi
