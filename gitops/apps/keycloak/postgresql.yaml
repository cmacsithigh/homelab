---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgresql
  namespace: keycloak-system
spec:
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    storageClass: local-path
    size: 1Gi
