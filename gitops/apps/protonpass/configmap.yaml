apiVersion: v1
kind: ConfigMap
metadata:
  name: protonpass-config
data:
  sync-interval: 10m
  secrets.json: |
    [
      {
        "targetNamespace": "renovate",
        "secretName": "renovate-token",
        "secretKey": "token",
        "protonItemName": "GITHUB_TOKEN"
      },
      {
        "targetNamespace": "cloudflared",
        "secretName": "cloudflared-credentials",
        "secretKey": "token",
        "protonItemName": "CLOUDFLARED_TUNNEL_TOKEN"
      },
      {
        "targetNamespace": "cert-manager",
        "secretName": "cloudflare-dns-token",
        "secretKey": "token",
        "protonItemName": "CLOUDFLARE_DNS_TOKEN"
      },
      {
        "targetNamespace": "flux-system",
        "secretName": "headlamp-client",
        "secretKey": "secret",
        "protonItemName": "HEADLAMP_CLIENT_SECRET"
      },
      {
        "targetNamespace": "media-system",
        "secretName": "openvpn-user",
        "secretKey": "OPENVPN_USER",
        "protonItemName": "OPENVPN_USER"
      },
      {
        "targetNamespace": "media-system",
        "secretName": "openvpn-password",
        "secretKey": "OPENVPN_PASSWORD",
        "protonItemName": "OPENVPN_PASSWORD"
      },
      {
        "targetNamespace": "tailscale",
        "secretName": "tailscale-auth",
        "secretKey": "TS_AUTHKEY",
        "protonItemName": "TAILSCALE_AUTH_KEY"
      },
      {
        "targetNamespace": "kopiur-system",
        "secretName": "kopiur-repository-secret",
        "secretKey": "KOPIA_PASSWORD",
        "protonItemName": "KOPIUR_REPOSITORY_SECRET"
      },
      {
        "targetNamespace": "pocket-id-system",
        "secretName": "pocket-id-encryption-key",
        "secretKey": "ENCRYPTION_KEY",
        "protonItemName": "POCKET_ID_ENCRYPTION_KEY"
      },
      {
        "targetNamespace": "pinepods",
        "secretName": "pinepods-oidc",
        "secretKey": "client-secret",
        "protonItemName": "PINEPODS_CLIENT_SECRET"
      }
    ]
  sync-secrets.sh: |
    #!/bin/bash
    set -euo pipefail

    CONFIG_FILE=/etc/protonpass/secrets.json
    SYNC_INTERVAL=${SYNC_INTERVAL:?SYNC_INTERVAL must be set}

    log() {
      local level=$1
      shift
      printf '%s %-5s %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$level" "$*"
    }

    if ! jq -e 'type == "array" and length > 0 and all(.[]; .targetNamespace and .secretName and .secretKey and .protonItemName)' "$CONFIG_FILE" >/dev/null; then
      log ERROR "Invalid secret mapping configuration in $CONFIG_FILE"
      exit 1
    fi

    sync_secrets() {
      local cycle=$1
      local mapping_count succeeded failed
      mapping_count=$(jq 'length' "$CONFIG_FILE")
      succeeded=0
      failed=0

      log INFO "Starting sync cycle $cycle ($mapping_count mappings)"
      log INFO "Logging into Proton Pass..."
      local login_output
      if ! login_output=$(pass-cli login 2>&1); then
        log ERROR "Proton Pass login failed: ${login_output:-no error output}"
        return 1
      fi

      local vault_json
      local vault_output
      if ! vault_output=$(pass-cli item list --vault-name "homelab" --output json 2>&1); then
        log ERROR "Unable to list items in the Proton Pass vault: ${vault_output:-no error output}"
        return 1
      fi
      vault_json=$vault_output
      unset vault_output

      while IFS= read -r mapping; do
        local target_namespace secret_name secret_key proton_item_name item_metadata item_id share_id item_ref secret_value secret_file
        target_namespace=$(jq -r '.targetNamespace' <<< "$mapping")
        secret_name=$(jq -r '.secretName' <<< "$mapping")
        secret_key=$(jq -r '.secretKey' <<< "$mapping")
        proton_item_name=$(jq -r '.protonItemName' <<< "$mapping")

        log INFO "Syncing item '$proton_item_name' to secret '$target_namespace/$secret_name'"
        if ! item_metadata=$(jq -er --arg title "$proton_item_name" '[.items[] | select(.title == $title)] | if length == 1 then .[0] | [.id, .share_id] | @tsv else error("expected exactly one matching item") end' <<< "$vault_json"); then
          log ERROR "Unable to resolve item '$proton_item_name': expected exactly one match in the vault"
          ((failed += 1))
          continue
        fi

        IFS=$'\t' read -r item_id share_id <<< "$item_metadata"
        if [[ -z "$item_id" || "$item_id" == "null" || -z "$share_id" || "$share_id" == "null" ]]; then
          log ERROR "Unable to sync item '$proton_item_name': vault result is missing item or share ID"
          ((failed += 1))
          continue
        fi

        item_ref="pass://${share_id}/${item_id}"
        local item_output
        if ! item_output=$(pass-cli item view "$item_ref" --output json 2>&1); then
          log ERROR "Unable to retrieve item '$proton_item_name': ${item_output:-no error output}"
          ((failed += 1))
          continue
        fi
        if ! secret_value=$(jq -er '[.. | objects | .password? | select(type == "string" and length > 0)] | first' <<< "$item_output"); then
          log ERROR "Unable to extract a password from item '$proton_item_name'"
          unset item_output
          ((failed += 1))
          continue
        fi
        unset item_output

        if ! secret_file=$(mktemp); then
          log ERROR "Unable to create a temporary file for secret '$target_namespace/$secret_name'"
          ((failed += 1))
          continue
        fi
        if ! printf '%s' "$secret_value" > "$secret_file"; then
          log ERROR "Unable to write the temporary secret file for '$target_namespace/$secret_name'"
          rm -f -- "$secret_file"
          ((failed += 1))
          continue
        fi
        unset secret_value

        local apply_output
        if apply_output=$(kubectl create secret generic "$secret_name" \
          --namespace "$target_namespace" \
          --from-file="$secret_key=$secret_file" \
          --dry-run=client -o yaml 2>&1 | kubectl apply -f - 2>&1); then
          log INFO "Synced secret '$target_namespace/$secret_name' (${apply_output:-kubectl apply completed})"
          ((succeeded += 1))
        else
          log ERROR "Failed to sync secret '$target_namespace/$secret_name': ${apply_output:-kubectl apply failed}"
          ((failed += 1))
        fi
        rm -f -- "$secret_file"
      done < <(jq -c '.[]' "$CONFIG_FILE")

      if [[ "$failed" -eq 0 ]]; then
        log INFO "Sync cycle $cycle complete: $succeeded/$mapping_count secrets synchronized"
      else
        log WARN "Sync cycle $cycle complete: $succeeded/$mapping_count secrets synchronized, $failed failed"
      fi

      return "$failed"
    }

    cycle=0
    log INFO "Starting Proton Pass secret sync (interval: $SYNC_INTERVAL)"
    while true; do
      ((cycle += 1))
      if ! sync_secrets "$cycle"; then
        log WARN "One or more secrets failed to sync; retrying after $SYNC_INTERVAL"
      else
        log INFO "All secrets synchronized; next sync in $SYNC_INTERVAL"
      fi
      sleep "$SYNC_INTERVAL"
    done
