apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: protonpass-secret-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: protonpass-secret-writer-binding
subjects:
  - kind: ServiceAccount
    name: protonpass-secret-creator
    namespace: protonpass
roleRef:
  kind: ClusterRole
  name: protonpass-secret-writer
  apiGroup: rbac.authorization.k8s.io