apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/stakater/charts/reloader
  ref:
    tag: 2.2.20 # {"$imagepolicy": "flux-system:reloader-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: flux-system
spec:
  releaseName: reloader
  chartRef:
    kind: OCIRepository
    name: reloader
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: reloader
  values:
    reloader:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        memory: 128Mi
