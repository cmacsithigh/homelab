---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: semaphoreui
  namespace: flux-system
spec:
  interval: 120m
  url: https://semaphoreui.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semaphore
  namespace: flux-system
spec:
  chart:
    spec:
      chart: semaphore
      sourceRef:
        kind: HelmRepository
        name: semaphoreui
        namespace: flux-system
      version: 16.2.2
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: semaphore
  values:
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.212