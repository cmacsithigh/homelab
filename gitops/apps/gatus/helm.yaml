# https://github.com/home-operations/gatus-sidecar/blob/main/charts/gatus-sidecar/values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gatus-sidecar
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/home-operations/charts/gatus-sidecar
  ref:
    tag: 0.5.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: flux-system
spec:
  releaseName: gatus
  chartRef:
    kind: OCIRepository
    name: gatus-sidecar
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: gatus-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: gatus-gatus-sidecar
              namespace: gatus-system
            patch: |-
              - op: add
                path: /metadata/annotations/metallb.io~1loadBalancerIPs
                value: 192.168.18.209
  values:
    config:
      existingConfigMap: gatus-config
      items:
        - key: config.yaml
          path: config.yaml
    persistence:
      enabled: true
      storageClass: nfs-storage
      accessMode: ReadWriteMany
      size: 2Gi
    sidecar:
      defaultInterval: 60s
      kinds:
        ingress:
          enable: true
          auto: true
          prefix: "[ingress]"
        httproute:
          enable: true
          auto: true
          prefix: "[httproute]"
        service:
          enable: true
          auto: true
          prefix: "[service]"
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 256Mi
    service:
      type: LoadBalancer
      port: 80