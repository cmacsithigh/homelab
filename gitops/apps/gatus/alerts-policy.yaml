---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: gatus-ntfy-alerts
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
    - apiGroups: [ "" ]
      apiVersions: [ "v1" ]
      operations: [ "CREATE", "UPDATE" ]
      resources: [ "services" ]
  matchConditions:
  - name: endpoint-annotation-missing
    expression: >-
      !has(object.metadata.annotations) || !("gatus.home-operations.com/endpoint" in object.metadata.annotations)
  reinvocationPolicy: IfNeeded
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: >-
        !has(object.metadata.annotations) ? [JSONPatch{
            op: "add",
            path: "/metadata/annotations",
            value: {"gatus.home-operations.com/endpoint": "alerts:\n  - type: ntfy"}
          }]
        : [JSONPatch{
            op: "add",
            path: "/metadata/annotations/gatus.home-operations.com~1endpoint",
            value: "alerts:\n  - type: ntfy"
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gatus-ntfy-alerts
spec:
  policyName: gatus-ntfy-alerts
