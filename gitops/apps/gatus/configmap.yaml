---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus-system
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /config/data.db
    alerting:
      ntfy:
        url: http://ntfy-ntfy.ntfy-system.svc.cluster.local
        topic: homelab
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 3
          send-on-resolved: true
