---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus-system
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /config/data.db
    alerting:
      ntfy:
        url: http://192.168.18.211
        topic: homelab
        default-alert:
          failure-threshold: 3
          success-threshold: 3
          send-on-resolved: true