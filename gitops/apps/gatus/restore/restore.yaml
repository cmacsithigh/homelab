apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: gatus-restore
  namespace: gatus-system
spec:
  source:
    fromPolicy:
      name: gatus
      offset: 0
  target:
    pvcRef:
      name: gatus-gatus-sidecar
  mover:
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 65532
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
