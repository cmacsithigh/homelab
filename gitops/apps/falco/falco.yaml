---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: flux-system
spec:
  chart:
    spec:
      chart: falco
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: falco
  values:
    falcosidekick:
      enabled: true