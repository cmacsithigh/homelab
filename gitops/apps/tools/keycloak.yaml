---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 120m
  url: oci://registry-1.docker.io/bitnamicharts/keycloak
  ref:
    tag: 25.2.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: keycloak
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: keycloak-system
  values:
    auth:
      adminUser: admin
      existingSecret: keycloak-credentials
      passwordSecretKey: password
    production: true
    hostname: keycloak.ciansheehy.co
    proxyHeaders: xforwarded
    httpEnabled: true
    hostnameStrict: true
    ingress:
      enabled: false
    postgresql:
      auth:
        existingSecret: keycloak-postgresql
