---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: eraser
  namespace: flux-system
spec:
  interval: 120m
  url: https://eraser-dev.github.io/eraser/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eraser
  namespace: flux-system
spec:
  chart:
    spec:
      chart: eraser
      sourceRef:
        kind: HelmRepository
        name: eraser
        namespace: flux-system
      version: 1.4.1
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: eraser-system