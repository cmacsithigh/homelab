---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-pg
  namespace: pocket-id-system
spec:
  inheritedMetadata:
    annotations:
      gatus.home-operations.com/enabled: "false"
  instances: 1
  bootstrap:
    initdb:
      database: pocket_id
      owner: pocket_id
      secret:
        name: pocket-id-database-credentials
  storage:
    storageClass: nfs-internal-ssd
    size: 5Gi
