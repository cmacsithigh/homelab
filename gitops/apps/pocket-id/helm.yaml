---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  interval: 120m
  url: https://anza-labs.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: flux-system
spec:
  releaseName: pocket-id
  chart:
    spec:
      chart: pocket-id
      sourceRef:
        kind: HelmRepository
        name: pocket-id
        namespace: flux-system
      version: 2.3.0
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: pocket-id-system
  values:
    host: pocketid.ciansheehy.co
    trustedPlatform: CF-Connecting-IP
    trustProxy: false
    analyticsDisabled: true
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.232
    ingress:
      enabled: false
    extraEnvFrom:
    - name: DB_CONNECTION_STRING
      value: "postgresql://pocket_id:${DB_PASSWORD}@pocket-id-pg-rw:5432/pocket_id"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pocket-id-pg-app
          key: password
    persistence:
      data:
        enabled: true
        storageClass: nfs-internal-ssd
        accessMode: ReadWriteMany
        size: 2Gi
    secret:
      create: false
      name: pocket-id-encryption-key
