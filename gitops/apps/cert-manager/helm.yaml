# https://github.com/helmforgedev/charts/blob/main/charts/adguard-home/values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 120m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: cert-manager
  values:
    crd:
      enabled: true