# https://github.com/helmforgedev/charts/blob/main/charts/adguard-home/values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 120m
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      version: v1.21.2
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: cert-manager
  values:
    crds:
      enabled: true