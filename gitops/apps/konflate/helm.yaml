---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: konflate
  namespace: flux-system
spec:
  interval: 15m
  ref:
    tag: 0.6.4
  url: oci://ghcr.io/home-operations/charts/konflate
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  install:
    createNamespace: true
    remediation:
      retries: 10
  interval: 60m
  targetNamespace: konflate
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: konflate-konflate
              namespace: konflate
            patch: |-
              - op: add
                path: /metadata/annotations/metallb.io~1loadBalancerIPs
                value: 192.168.18.211
  values:
    config:
      repo: github://cmacsithigh/homelab
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.ciansheehy.co
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token
    service:
      type: LoadBalancer
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 500Mi