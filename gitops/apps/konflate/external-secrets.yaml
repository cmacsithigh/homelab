---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: konflate
spec:
  provider:
    vault:
      server: http://openbao-system-openbao.openbao-system.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: konflate-reader
          serviceAccountRef:
            name: konflate-konflate
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook-token
  namespace: konflate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: konflate-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: KONFLATE_APP_CLIENT_ID
      remoteRef:
        key: konflate-webhook-token
        property: KONFLATE_APP_CLIENT_ID
    - secretKey: KONFLATE_APP_PRIVATE_KEY
      remoteRef:
        key: konflate-webhook-token
        property: KONFLATE_APP_PRIVATE_KEY
    - secretKey: KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: konflate-webhook-token
        property: KONFLATE_WEBHOOK_SECRET