# https://github.com/external-secrets/external-secrets/blob/main/deploy/charts/external-secrets/values.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/external-secrets/charts/external-secrets
  ref:
    tag: 2.15.0 # {"$imagepolicy": "flux-system:external-secrets-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  releaseName: external-secrets
  chartRef:
    kind: OCIRepository
    name: external-secrets
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: external-secrets-system
  values:
    crds:
      enabled: true
      keep: true
    metrics:
      service:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi