---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ntfy
  namespace: flux-system
spec:
  interval: 120m
  url: oci://ghcr.io/helmforgedev/helm/ntfy
  ref:
    tag: 1.8.0 # {"$imagepolicy": "flux-system:ntfy-chart:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: flux-system
spec:
  releaseName: ntfy
  chartRef:
    kind: OCIRepository
    name: ntfy
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: ntfy-system
  values:
    ntfy:
      baseUrl: https://ntfy.ciansheehy.co
      authDefaultAccess: read-write
      behindProxy: true
      enableMetrics: true
      extraConfig: |
        upstream-base-url: "https://ntfy.sh"
    persistence:
      enabled: true
      size: 1Gi
      storageClass: nfs-internal-ssd
      accessModes:
      - ReadWriteMany
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.211
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
