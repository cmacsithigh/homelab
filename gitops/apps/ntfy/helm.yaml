---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: helmforge
  namespace: flux-system
spec:
  interval: 120m
  url: https://repo.helmforge.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ntfy
      version: 1.2.2
      sourceRef:
        kind: HelmRepository
        name: helmforge
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: ntfy-system
  values:
    ntfy:
      baseUrl: http://192.168.18.210
      authDefaultAccess: read-write
      behindProxy: true
      enableMetrics: true
    persistence:
      enabled: true
      size: 1Gi
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.18.210
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
