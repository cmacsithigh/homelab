apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ntfy-restore
  namespace: ntfy-system
spec:
  source:
    fromPolicy:
      name: ntfy
      offset: 0
  target:
    pvcRef:
      name: ntfy-ntfy-data
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
