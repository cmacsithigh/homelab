---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-internal-ssd
  labels:
    app: nfs-internal-ssd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-internal-ssd
  template:
    metadata:
      labels:
        app: nfs-internal-ssd
    spec:
      nodeSelector:
        kubernetes.io/hostname: rpi5-worker
      serviceAccountName: nfs-client-provisioner
      containers:
      - name: app
        image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
        volumeMounts:
        - name: nfs-client-root
          mountPath: /persistentvolumes
        env:
        - name: PROVISIONER_NAME
          value: nfs-internal-ssd
        - name: NFS_SERVER
          value: "192.168.18.14"
        - name: NFS_PATH
          value: "/mnt/data/nfs"
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 512Mi
      volumes:
      - name: nfs-client-root
        nfs:
          server: "192.168.18.14"
          path: "/mnt/data/nfs"
