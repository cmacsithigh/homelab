apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: local-nfs
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: 192.168.18.10
          path: /mnt/nfs/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  concurrency:
    maxConcurrentJobs: 2
  scheduleDefaults:
    timezone: Europe/Dublin
  create:
    enabled: true
  deletionProtection:
    threshold: 30
  moverDefaults:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
  credentialProjection:
    allowed: true
