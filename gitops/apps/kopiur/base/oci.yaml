apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kopiur
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/home-operations/charts/kopiur
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.11.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  namespace: flux-system
spec:
  releaseName: kopiur
  chartRef:
    kind: OCIRepository
    name: kopiur
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 1h
  targetNamespace: kopiur-system
  values:
    features:
      credentialProjection:
        enabled: true
    logging:
      level: "info,kopia=debug"
