apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-config
  namespace: homeassistant
  labels:
    app: homeassistant
data:
  automations.yaml: |-
    ---
    - id: '1737837864723'
      alias: Speakers - Set morning volume
      description: ''
      triggers:
      - at: 06:00:00
        trigger: time
      conditions: []
      actions:
      - action: media_player.volume_set
        data:
          volume_level: 0.2
        metadata: {}
        target:
          area_id: hallway
      - action: media_player.volume_set
        metadata: {}
        target:
          area_id: bedroom
        data:
          volume_level: 0.3
      mode: single
    - id: '1745318078223'
      alias: Lights - Turn off
      description: ''
      triggers:
      - at: '23:00:00'
        trigger: time
      - event: sunrise
        offset: +01:00:00
        trigger: sun
      conditions: []
      actions:
      - action: light.turn_off
        data: {}
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - id: '1763715242657'
      alias: Speakers - Set work volume
      description: ''
      triggers:
      - at: 09:00:00
        trigger: time
        weekday:
        - fri
        - thu
        - wed
        - tue
        - mon
      conditions: []
      actions:
      - action: media_player.volume_set
        data:
          volume_level: 0.05
        metadata: {}
        target:
          area_id: cian_office
      - action: media_player.volume_set
        data:
          volume_level: 0.2
        metadata: {}
        target:
          area_id: hallway
      mode: single
    - id: '1769024245390'
      alias: Lights - Turn on
      description: ''
      triggers:
      - event: sunset
        offset: -01:00:00
        trigger: sun
      - event: sunrise
        offset: -01:00:00
        trigger: sun
      conditions:
      - after: 06:00:00
        before: '22:00:00'
        condition: time
      actions:
      - action: light.turn_on
        data:
          brightness_pct: 66
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - id: '1769467026597'
      alias: Lights - Turn down
      description: ''
      triggers:
      - at: '22:30:00'
        trigger: time
      conditions: []
      actions:
      - action: light.turn_on
        data:
          brightness_pct: 30
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - id: '1789106917350'
      alias: Lights Off - Again
      description: ''
      triggers:
      - at: '23:30:00'
        trigger: time
      conditions: []
      actions:
      - action: script.all_lights_off
        metadata: {}
        data: {}
      mode: single
    - id: '1789972700788'
      alias: Speakers - Join bedroom to sound system
      description: ''
      triggers:
      - trigger: time
        at: 06:00:00
        weekday:
        - sun
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
      conditions: []
      actions:
      - action: media_player.join
        metadata: {}
        target:
          area_id: hallway
        data:
          group_members:
          - media_player.rc0
      mode: single
    - id: '1789972772761'
      alias: Speakers - Join office to sound system
      description: ''
      triggers:
      - trigger: time
        at: 09:00:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      conditions: []
      actions:
      - action: media_player.join
        metadata: {}
        target:
          area_id: hallway
        data:
          group_members:
          - media_player.pi0_rc3
      mode: single
    - id: '1789972837370'
      alias: Speakers - Remove bedroom from sound system
      description: ''
      triggers:
      - trigger: time
        at: 09:00:00
        weekday:
        - sun
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
      conditions: []
      actions:
      - action: media_player.unjoin
        metadata: {}
        target:
          area_id:
          - bedroom
        data: {}
      mode: single
    - id: '1789972898752'
      alias: Speakers - Remove office from sound system
      description: ''
      triggers:
      - trigger: time
        at: '17:00:00'
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      conditions: []
      actions:
      - action: media_player.unjoin
        metadata: {}
        data: {}
        target:
          area_id: cian_office
      mode: single
    - id: '1789972990047'
      alias: Speakers - Morning - Play Lyric
      description: ''
      triggers:
      - trigger: time
        at: 07:00:00
        weekday:
        - sun
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
      - trigger: time
        at: 08:00:00
        weekday:
        - sun
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
      conditions: []
      actions:
      - action: media_player.play_media
        metadata: {}
        target:
          area_id:
          - hallway
          - bedroom
        data:
          enqueue: replace
          media:
            media_content_id: library://radio/3
            media_content_type: music
            metadata:
              title: Lyric FM
              thumbnail: https://media.info/l/o/2/23.1386005631.png
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: music_assistant
                media_content_id: radio
              browse_entity_id: media_player.rc2
      mode: single
    - id: '1789973052234'
      alias: Speakers - Work - Play FIP
      description: ''
      triggers:
      - trigger: time
        at: 09:00:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      conditions: []
      actions:
      - action: media_player.play_media
        metadata: {}
        target:
          area_id:
          - hallway
          - cian_office
        data:
          enqueue: replace
          media:
            media_content_id: library://radio/1
            media_content_type: music
            metadata:
              title: FIP
              thumbnail: https://upload.wikimedia.org/wikipedia/commons/1/16/FIP_logo_2021.svg
              media_class: music
              children_media_class:
              navigateIds:
              - {}
              - media_content_type: music_assistant
                media_content_id: radio
              browse_entity_id: media_player.rc2
      mode: single
  configuration.yaml: |-
    default_config:

    homeassistant:
      external_url: https://home.ciansheehy.co
      internal_url: http://localhost:8123
      auth_providers:
        - type: trusted_networks
          trusted_networks:
            - "192.168.0.0/19"
            - "172.21.0.0/20"
          allow_bypass_login: true
        - type: homeassistant

    automation: !include automations.yaml
    script: !include scripts.yaml

    http:
      use_x_forwarded_for: true
      ip_ban_enabled: false
      trusted_proxies:
        - 127.0.0.1
        - ::1
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.0.0/16
        - 172.16.0.0/12
  scripts.yaml: |-
    snapcast_radio:
      alias: Snapcast - Switch to Radio
      sequence:
        - action: media_player.select_source
          target:
            area_id:
              - hallway
              - bedroom
          data:
            source: Radio

    snapcast_spotify:
      alias: Snapcast - Switch to Spotify
      sequence:
        - action: media_player.select_source
          target:
            area_id:
              - hallway
              - bedroom
          data:
            source: Spotify

    all_lights_on:
      alias: All lights on
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ states.light | map(attribute='entity_id') | list }}"

    all_lights_off:
      alias: All lights off
      sequence:
        - action: light.turn_off
          target:
            entity_id: "{{ states.light | map(attribute='entity_id') | list }}"
