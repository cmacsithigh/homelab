apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-config
  namespace: homeassistant
  labels:
    app: homeassistant
data:
  automations.yaml: |-
    ---
    - actions:
      - action: media_player.select_source
        data:
          source: Radio
        metadata: {}
        target:
          area_id:
          - hallway
          - bedroom
      alias: Speakers - Set source to Radio
      conditions: []
      description: ''
      id: '1737837812789'
      mode: single
      triggers:
      - at: 05:00:00
        trigger: time
    - actions:
      - action: media_player.volume_set
        data:
          volume_level: 0.2
        metadata: {}
        target:
          area_id: hallway
      alias: Hallway speaker - Set morning volume
      conditions: []
      description: ''
      id: '1737837864723'
      mode: single
      triggers:
      - at: 06:00:00
        trigger: time
    - actions:
      - action: media_player.volume_mute
        data:
          is_volume_muted: false
        metadata: {}
        target:
          area_id: bedroom
      alias: Bedroom speaker - Unmute
      conditions: []
      description: ''
      id: '1741799476593'
      mode: single
      triggers:
      - at: 06:00:00
        trigger: time
    - id: '1745318078223'
      alias: Lights - Turn off
      description: ''
      triggers:
      - at: '23:00:00'
        trigger: time
      - event: sunrise
        offset: +01:00:00
        trigger: sun
      conditions: []
      actions:
      - action: light.turn_off
        data: {}
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - actions:
      - action: media_player.volume_mute
        data:
          is_volume_muted: false
        metadata: {}
        target:
          area_id: hallway
      alias: Hallway speaker - Unmute
      conditions: []
      description: ''
      id: '1746819491925'
      mode: single
      triggers:
      - at: 07:00:00
        trigger: time
    - actions:
      - action: media_player.volume_mute
        data:
          is_volume_muted: true
        metadata: {}
        target:
          area_id:
          - bedroom
          - hallway
      alias: Speakers - Mute
      conditions: []
      description: ''
      id: '1746819680520'
      mode: single
      triggers:
      - at: '23:00:00'
        trigger: time
    - actions:
      - action: media_player.volume_set
        data:
          volume_level: 0.5
        metadata: {}
        target:
          area_id: bedroom
      alias: Bedroom speaker - Morning volume
      conditions: []
      description: ''
      id: '1749156182427'
      mode: single
      triggers:
      - at: 05:00:00
        trigger: time
    - actions:
      - action: media_player.volume_set
        data:
          volume_level: 0.5
        metadata: {}
        target:
          area_id: bedroom
      alias: Bedroom speaker - Set work volume
      conditions:
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
      description: ''
      id: '1763715242657'
      mode: single
      triggers:
      - at: 09:00:00
        trigger: time
    - id: '1769024245390'
      alias: Lights - Turn on
      description: ''
      triggers:
      - event: sunset
        offset: -01:00:00
        trigger: sun
      - event: sunrise
        offset: -01:00:00
        trigger: sun
      conditions:
      - after: 06:00:00
        before: '22:00:00'
        condition: time
      actions:
      - action: light.turn_on
        data:
          brightness_pct: 66
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - id: '1769467026597'
      alias: Lights - Turn down
      description: ''
      triggers:
      - at: '22:30:00'
        trigger: time
      conditions: []
      actions:
      - action: light.turn_on
        data:
          brightness_pct: 30
        metadata: {}
        target:
          area_id:
          - living_room
          - hallway
      mode: single
    - id: '1788806019512'
      alias: Speakers - Set source to Spotify
      description: ''
      triggers:
      - at: 04:55:00
        trigger: time
      conditions: []
      actions:
      - action: media_player.select_source
        data:
          source: Spotify
        metadata: {}
        target:
          area_id:
          - hallway
          - bedroom
      mode: single
    - id: '1789106917350'
      alias: Lights Off - Again
      description: ''
      triggers:
      - at: '23:30:00'
        trigger: time
      conditions: []
      actions:
      - action: script.all_lights_off
        metadata: {}
        data: {}
      mode: single
  configuration.yaml: |-
    default_config:

    homeassistant:
      external_url: https://home.ciansheehy.co
      internal_url: http://localhost:8123
      auth_providers:
        - type: trusted_networks
          trusted_networks:
            - "192.168.0.0/19"
            - "172.21.0.0/20"
          allow_bypass_login: true
        - type: homeassistant

    automation: !include automations.yaml
    script: !include scripts.yaml

    http:
      use_x_forwarded_for: true
      ip_ban_enabled: false
      trusted_proxies:
        - 127.0.0.1
        - ::1
        - 10.42.0.0/16
        - 10.43.0.0/16
        - 192.168.0.0/16
        - 172.16.0.0/12
  scripts.yaml: |-
    snapcast_radio:
      alias: Snapcast - Switch to Radio
      sequence:
        - action: media_player.select_source
          target:
            area_id:
              - hallway
              - bedroom
          data:
            source: Radio

    snapcast_spotify:
      alias: Snapcast - Switch to Spotify
      sequence:
        - action: media_player.select_source
          target:
            area_id:
              - hallway
              - bedroom
          data:
            source: Spotify

    all_lights_on:
      alias: All lights on
      sequence:
        - action: light.turn_on
          target:
            entity_id: "{{ states.light | map(attribute='entity_id') | list }}"

    all_lights_off:
      alias: All lights off
      sequence:
        - action: light.turn_off
          target:
            entity_id: "{{ states.light | map(attribute='entity_id') | list }}"
