apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: homeassistant-restore
  namespace: homeassistant
spec:
  source:
    fromPolicy:
      name: homeassistant
      offset: 0
  target:
    pvcRef:
      name: homeassistant-data
  policy:
    onMissingSnapshot: Fail
  credentialProjection:
    enabled: true
  options:
    overwriteFiles: true
    overwriteDirectories: true
