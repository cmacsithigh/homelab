---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-data
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-internal-ssd
  resources:
    requests:
      storage: 2Gi
