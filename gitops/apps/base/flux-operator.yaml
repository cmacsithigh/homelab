---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 60m
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.64.0 # {"$imagepolicy": "flux-system:flux-operator:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  releaseName: flux-operator
  interval: 60m
  chartRef:
    kind: OCIRepository
    name: flux-operator
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  targetNamespace: flux-system
  values:
    reporting:
      interval: 30s
    commonAnnotations:
      gatus.home-operations.com/enabled: "false"
    web:
      config:
        authentication:
          anonymous:
            groups:
            - flux-admin
            username: flux
          type: Anonymous
      enabled: true
