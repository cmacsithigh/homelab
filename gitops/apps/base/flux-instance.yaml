---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  distribution:
    version: 2.10.1 # {"$imagepolicy": "flux-system:flux-instance:tag"}
    registry: "ghcr.io/fluxcd"
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - image-reflector-controller
  - image-automation-controller
  - notification-controller
  cluster:
    size: small
    networkPolicy: false
  sync:
    interval: 1m
    kind: GitRepository
    path: ./gitops/cluster
    ref: refs/heads/main
    url: https://github.com/cmacsithigh/homelab.git
    pullSecret: basic-access-auth
