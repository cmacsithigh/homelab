apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: "1.20.5" # Match your desired Cilium version
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  releaseName: cilium
  chartRef:
    kind: OCIRepository
    name: cilium
    namespace: flux-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  interval: 60m
  targetNamespace: kube-system
  values:
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList:
        - "10.42.0.0/16"
    kubeProxyReplacement: true
    k8sServiceHost: "192.168.18.10"
    k8sServicePort: 6443
    envoy:
      enabled: false
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
