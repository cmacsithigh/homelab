apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: image-updates
  namespace: flux-system
spec:
  providerRef:
    name: ntfy
  eventSeverity: info
  eventSources:
  - kind: ImageUpdateAutomation
    name: '*'
  eventMetadata:
    summary: "Flux image update"
  exclusionList:
  - "(?i)renovate"
