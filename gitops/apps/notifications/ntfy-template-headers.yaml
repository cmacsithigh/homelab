apiVersion: v1
kind: Secret
metadata:
  name: ntfy-template-headers
  namespace: flux-system
type: Opaque
stringData:
  headers: |
    X-Template: "yes"
    X-Title: '{{ .involvedObject.name }} image update'
    X-Message: '\n{{- $lines := splitList "\n" .message -}}{{- if gt (len $lines) 1 -}}{{ index $lines 1 }}{{- else -}}{{ .message }}{{- end -}}'
    X-Priority: '{{ if eq .severity "error" }}5{{ else }}3{{ end }}'
    X-Tags: 'rocket'
